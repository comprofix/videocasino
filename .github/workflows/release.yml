# Builds a release when a version tag such as v1.0.0 is pushed: checks on
# Linux and Windows, a Windows zip and a Linux tarball, and a GitHub release
# holding both with that version's notes from CHANGELOG.md. The builds run
# on Ubuntu; the Windows build needs no cgo, so it is cross-built.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  LINUX_DEPS: >-
    libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev
    libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

jobs:
  # The tests run on Windows as well as Linux, as the game is played on
  # both, even though the Windows build itself is made on Ubuntu.
  check:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux dev packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: check
    # Building on an older Ubuntu lets the Linux build run on older systems.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - goos: windows
            cgo: "0"
            exe: videocasino.exe
            ldflags: -H=windowsgui
          - goos: linux
            cgo: "1"
            exe: videocasino
            ldflags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Both builds need them: the Linux one to build, the Windows one to
      # draw the exe icon, which goes through ui and so Ebitengine.
      - name: Install Linux dev packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      # The icon Explorer shows on the exe is linked in from a .syso beside
      # main.go, made from the same drawing as the window's icon. Its name
      # limits it to windows/amd64 builds.
      - name: Make the exe icon
        if: matrix.goos == 'windows'
        run: |
          go run ./cmd/winicon videocasino.ico
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico videocasino.ico -o rsrc_windows_amd64.syso
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags "-s -w ${{ matrix.ldflags }}" \
            -o "stage/${{ matrix.exe }}" .
      - name: Package
        run: |
          name="videocasino-$GITHUB_REF_NAME-${{ matrix.goos }}-amd64"
          mkdir dist
          mv stage "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ matrix.goos }}" = windows ]; then
            zip -r "dist/$name.zip" "$name"
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # The release is titled with the tag's message. The checkout may hold
      # the tag without it, so the tag is fetched again whole.
      - name: Release title
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "$GITHUB_REF_NAME is not an annotated tag" >&2
            exit 1
          fi
          git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" > title.txt
      # The notes are this version's section of CHANGELOG.md, as committed
      # in the release commit, without its heading.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" '
            index($0, "## ") == 1 { if (on) exit; on = index($0, h) == 1; next }
            on
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Publish release
        run: |
          # A re-run replaces the files on the existing release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$(cat title.txt)" \
              --notes-file notes.md \
              --verify-tag
          fi
