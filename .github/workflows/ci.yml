# Checks every push and pull request: vet, test and build, on Linux and
# Windows. The slow calculations are left to long-tests.yml.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Ebitengine needs cgo on Linux, with the X11, GL and sound headers.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o videocasino .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags -H=windowsgui -o videocasino.exe .
